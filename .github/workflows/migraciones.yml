name: Migraciones

# Aplica a Supabase las migraciones nuevas en cuanto llegan a main.
# Necesita dos secretos del repositorio (Settings → Secrets and variables →
# Actions): SUPABASE_ACCESS_TOKEN y NEXT_PUBLIC_SUPABASE_URL.
# Si prefieres no dejar el token en GitHub, borra este archivo y aplica las
# migraciones a mano con `npm run migrar`.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  aplicar:
    runs-on: ubuntu-latest
    # Los secretos no se pueden leer en un `if`: se pasan al entorno del job y
    # se mira el entorno.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      # Sin los secretos no es un error: las migraciones se aplican a mano.
      # Se deja una nota en el resumen y el run sale en verde, sin tumbar nada.
      - name: Sin secretos, se salta
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: |
          echo "::notice title=Migraciones sin aplicar::Faltan los secretos SUPABASE_ACCESS_TOKEN o NEXT_PUBLIC_SUPABASE_URL. Aplica supabase/migrations a mano (npm run migrar o el SQL Editor)."

      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.NEXT_PUBLIC_SUPABASE_URL != ''

      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.NEXT_PUBLIC_SUPABASE_URL != ''
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.NEXT_PUBLIC_SUPABASE_URL != ''

      - name: Aplicar migraciones pendientes
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npx tsx scripts/migrar.mts
